name: Deploy to EC2 with CodeDeploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create deployment bundle
        run: zip -r deployment.zip app.py requirements.txt appspec.yml deploy.sh scripts .github -x "*.git*"

      - name: Upload bundle to S3
        run: |
          aws s3 cp deployment.zip "s3://${{ secrets.S3_BUCKET }}/ec2-auto-deploy/deployment-${{ github.sha }}.zip"

      - name: Deploy using AWS CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name "${{ secrets.CODEDEPLOY_APPLICATION }}" \
            --deployment-group-name "${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }}" \
            --s3-location bucket="${{ secrets.S3_BUCKET }}",key="ec2-auto-deploy/deployment-${{ github.sha }}.zip",bundleType=zip \
            --deployment-config-name CodeDeployDefault.OneAtATime
